    <title>Animation</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo 样式 */
        .site-logo {
            width: 205px;
            height: 120px;
            margin-bottom: 20px;
        }

        /* 导航及基础样式 */
        nav { margin-bottom: 20px; }
        nav a { margin: 0 15px; text-decoration: none; color: #888; font-size: 0.9em; letter-spacing: 2px; text-transform: uppercase; }
        nav a:hover, nav a.active { color: #000; }

        h2 { font-size: 1.2em; color: #555; text-transform: uppercase; letter-spacing: 2px; margin: 40px 0 20px; }
        hr { width: 100%; max-width: 900px; border: 0; border-top: 1px solid #eee; margin: 20px 0; }

        /* 商业项目网格布局 */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 900px;
            width: 100%;
        }

        .project-item { text-align: center; }
        
        .project-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: brightness(100%);
        }

        /* 悬停变亮放大效果 */
        .project-item img:hover {
            transform: scale(1.05);
            filter: brightness(115%);
            cursor: pointer;
        }

        .project-title { margin-top: 10px; font-size: 0.85em; color: #777; }
    </style>
</head>
