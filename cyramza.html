<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyramza - Hazel Zheng</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .site-logo { 
            width: 205px; 
            height: 120px; 
            margin-bottom: 20px; 
        }

        nav { margin-bottom: 50px; }
        nav a { 
            margin: 0 15px; 
            text-decoration: none; 
            color: #888; 
            font-size: 0.9em; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            transition: color 0.3s ease; 
        }
        nav a:hover, nav a.active { color: #000; }

        .content-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 正文样式 */
        .description-text {
            text-align: center;
            font-size: 1.05em;
            margin-bottom: 30px; /* 文本到底部视频的距离 */
            color: #333;
        }

        .title-italic { font-style: italic; }

        /* 全视频链接样式 */
        .full-video-link {
            display: block;
            margin-top: 10px;
            color: #800000;
            text-decoration: underline;
        }

        /* 统一间距容器 */
        .media-item {
            margin-bottom: 30px; /* 统一设置视频与图片、图片与图片间的垂直距离 */
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center; /* 确保容器内元素水平居中 */
        }

        .media-item iframe {
            max-width: 100%;
            width: 640px; /* 设定视频固有宽度 */
        }

        .media-item img {
            max-width: 100%;
            height: auto; /* 保持图片纵横比 */
            display: block;
            margin: 0 auto; /* 确保图片居中 */
        }
    </style>
</head>
<body>

    <img src="images/logo.png" alt="Logo" class="site-logo">

    <nav>
        <a href="index.html">PAINTING</a>
        <a href="animation.html" class="active">ANIMATION</a>
        <a href="contact.html">CONTACT</a>
    </nav>

    <div class="content-container">
        
        <!-- 正文信息 -->
        <div class="description-text">
            <span class="title-italic">Cyramza Planimation</span><br>
            Director: Yves Geleyn<br>
            2D Lead Animator: Natalie Labarre<br>
            Animators: Sara Litzenberger, Sami Healy, Hyo Bin Kang, Pengpeng Du, Aran Quinn, Tyler Dibiasio<br>
            Clean Up Animators: Josh Brennan, Tyler Dibiasio, Hazel Zheng, Seongjin Yoon<br>
            <!-- 注意：用户要求文字是 Full Video，但链接描述写成了 More Info。此处按链接描述为准，文字也更新为 More Info 以匹配超链接意图。 -->
            <a href="https://hellohornet.com/yves-geleyn.html?project=cyramza-planimation" class="full-video-link">More Info</a>
        </div>

        <!-- 视频容器 -->
        <div class="media-item">
            <div style="padding:75% 0 0 0;position:relative; width: 100%; max-width: 640px;">
                <iframe src="https://player.vimeo.com/video/714839216?h=cc4bc54d72&badge=0&autopause=0&player_id=0&app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;" title="Cyramza compressed_01.mov"></iframe>
            </div>
            <script src="https://player.vimeo.com/api/player.js"></script>
        </div>

        <!-- 图片 1 -->
        <div class="media-item">
            <img src="cyramza_1.jpg" alt="Cyramza Scene 1">
        </div>

        <!-- 图片 2 -->
        <div class="media-item">
            <img src="cyramza_2.jpg" alt="Cyramza Scene 2">
        </div>

    </div>

</body>
</html>
