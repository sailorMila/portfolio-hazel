<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/png" href="/images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lizzo x Queer Eye - Hazel Zheng</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: scroll;
        }

        .site-logo {
            width: 205px;
            height: 120px;
            margin-bottom: 20px;
        }

        /* 导航样式已调整为与 index.html 完全一致 */
        nav { margin-bottom: 50px; }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #888;
            font-size: 0.9em;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }
        nav a:hover, nav a.active { color: #000; }

        .content-container {
            max-width: 640px;
            width: 100%;
            text-align: center;
        }

        .description-text {
            margin-bottom: 20px; /* 调整此项可控制文字与下方内容的距离 */
            font-size: 1.05em;
            color: #555;
        }

        .media-item {
            margin-bottom: 30px;
            width: 100%;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .media-item img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <img src="images/logo.png" alt="Logo" class="site-logo">

    <nav>
        <a href="index.html">PAINTING</a>
        <a href="animation.html">ANIMATION</a>
        <a href="contact.html">CONTACT</a>
    </nav>

    <div class="content-container">
        <div class="description-text">
            <p>
                The official lyric video for "Soulmate"<br>
                featuring Lizzo and Queer Eye's Fab Five! From the album ‘Cuz I Love You.’
            </p>
        </div>

        <div class="media-item">
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/js_FjrxJuxA" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <div class="media-item">
            <div class="video-wrapper">
                <iframe src="https://player.vimeo.com/video/449923545" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
            <p style="font-size: 0.8em; color: #888;">Lizzo x Queer Eye - Soulmate - Corgis by Qing Zheng (Hazel)</p>
        </div>

        <div class="media-item"><img src="images/lizzo_orig.gif" alt="Lizzo animation"></div>
        <div class="media-item"><img src="images/1111_orig.gif" alt="Corgi 1"></div>
        <div class="media-item"><img src="images/2222_orig.gif" alt="Corgi 2"></div>
        <div class="media-item"><img src="images/3333_orig.gif" alt="Corgi 3"></div>
    </div>

</body>
</html>
